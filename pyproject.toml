[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvorum"
version = "0.1.0"
description = "Cross-review by a panel of heterogeneous LLMs with a fail-closed quorum."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kvorum contributors" }]
keywords = ["llm", "code-review", "review", "quorum", "multi-model", "agents"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.scripts]
kvorum = "kvorum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kvorum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
